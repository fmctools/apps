<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- The UI Gallery's icon, with a falling T piece: gradient disc, soft sheen, white glyph with a shadow. -->
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0.05" x2="0.85" y2="0.95"><stop offset="0" stop-color="#9A86FF"/><stop offset="0.5" stop-color="#5B6CF2"/><stop offset="1" stop-color="#2B9BE0"/></linearGradient>
    <radialGradient id="sheen" cx="0.32" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity="0.32"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.4" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <circle cx="48" cy="48" r="48" fill="url(#bg)"/>
  <circle cx="48" cy="48" r="48" fill="url(#sheen)"/>
  <circle cx="48" cy="48" r="47" fill="none" stroke="#fff" stroke-opacity="0.14" stroke-width="2"/>
  <g filter="url(#shadow)" fill="#fff">
    <!-- the T piece -->
    <rect x="24" y="24" width="14" height="14" rx="4"/>
    <rect x="41" y="24" width="14" height="14" rx="4"/>
    <rect x="58" y="24" width="14" height="14" rx="4"/>
    <rect x="41" y="41" width="14" height="14" rx="4"/>
    <!-- the row under it, with a gap the stem fits into -->
    <g fill-opacity="0.55">
      <rect x="24" y="58" width="14" height="14" rx="4"/>
      <rect x="58" y="58" width="14" height="14" rx="4"/>
    </g>
  </g>
</svg>
