<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E6EC8"/>
      <stop offset="52%" stop-color="#58C4E8"/>
      <stop offset="100%" stop-color="#0B4F8A"/>
    </linearGradient>
    <radialGradient id="sheen" cx="30%" cy="22%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1AB0C8"/>
      <stop offset="50%" stop-color="#0D6BA4"/>
      <stop offset="100%" stop-color="#073463"/>
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="48" cy="48" r="46"/>
    </clipPath>
  </defs>

  <g clip-path="url(#circleClip)">
    <!-- Sky & Sun -->
    <rect x="0" y="0" width="96" height="44" fill="url(#sky)"/>
    <circle cx="66" cy="24" r="10" fill="#FFE38A" opacity="0.9"/>
    <circle cx="66" cy="24" r="16" fill="#FFD166" opacity="0.28"/>

    <!-- Shore -->
    <path d="M0 39 Q26 35 48 39 T96 38 L96 44 L0 44 Z" fill="#2B8A5E"/>

    <!-- Water -->
    <rect x="0" y="42" width="96" height="54" fill="url(#water)"/>
    <ellipse cx="36" cy="60" rx="18" ry="6" fill="none" stroke="#B8F4FF" stroke-width="2" opacity="0.65"/>
    <ellipse cx="36" cy="60" rx="10" ry="3.2" fill="none" stroke="#FFFFFF" stroke-width="1.6" opacity="0.85"/>

    <!-- Swimming golden fish silhouette -->
    <path d="M52 72 Q64 64 74 72 Q64 80 52 72 Z" fill="#FFB22E"/>
    <polygon points="73,72 82,66 80,72 82,78" fill="#F28C18"/>
    <circle cx="58" cy="70.5" r="1.4" fill="#182230"/>

    <!-- Fishing rod & line -->
    <path d="M74 96 Q64 56 44 26" fill="none" stroke="#3B2416" stroke-width="5" stroke-linecap="round"/>
    <path d="M74 96 Q64 56 44 26" fill="none" stroke="#E0B066" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="44" y1="26" x2="36" y2="55" stroke="#E6FAFF" stroke-width="1.4"/>

    <!-- Bobber -->
    <line x1="36" y1="51" x2="36" y2="62" stroke="#182230" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="36" cy="57" r="5" fill="#FFFFFF"/>
    <path d="M31 57 A5 5 0 0 1 41 57 Z" fill="#FF4838"/>

    <!-- Specular sheen -->
    <circle cx="48" cy="48" r="46" fill="url(#sheen)"/>
  </g>

  <circle cx="48" cy="48" r="46" fill="none" stroke="#9EEAFF" stroke-width="2" opacity="0.45"/>
</svg>
